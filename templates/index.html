<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成工作台</title>
<link rel="stylesheet" href="/static/style.css?v=20260916a">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">⚡ 生成工作台</div>
    <div class="top-right">
      <button class="btn-ghost" id="luxBtn">✨ 豪横预设</button>
      <button class="btn-ghost" id="importBtn">📥 导入模型</button>
      <button class="btn-ghost" id="favBtn">⭐ 收藏 (<span id="favCount">0</span>)</button>
      <div class="conn" id="conn">连接中...</div>
    </div>
  </header>

  <main class="layout">
    <div class="tabbar" id="tabbar">
      <button class="tab active" data-page="gen">⚙ 生成</button>
      <button class="tab" data-page="imgs">🖼 图片</button>
    </div>

    <aside class="panel page-gen active">
      <section class="card">
        <h3>模型</h3>
        <label>Checkpoint <select id="ckpt"></select></label>
        <label>LoRA</label>
        <div id="loraList"></div>
        <button class="btn-ghost" id="addLora">+ 添加 LoRA</button>
        <label>VAE <select id="vae"></select></label>
        <label>CLIP Skip
          <input id="clipSkip" type="number" min="1" max="4" value="1">
        </label>
      </section>

      <section class="card">
        <h3 id="i2iToggle" style="cursor:pointer;user-select:none" title="点击收起/展开">img2img 参考图 <span id="i2iArrow" style="font-size:11px;color:#888"></span></h3>
        <div id="i2iBody">
        <label class="checkline">
          <input type="checkbox" id="i2iOn">
          <span>使用参考图重绘（img2img）</span>
        </label>
        <input type="file" id="refFile" accept="image/*" style="width:100%">
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
          <img id="refPreview" style="max-height:96px;display:none;border-radius:8px" alt="">
          <span id="refName" style="font-size:12px;color:#888"></span>
        </div>
        <label style="margin-top:8px">重绘幅度 (denoise，越高越偏离原图)
          <input id="denoise" type="number" value="0.5" step="0.05" min="0.1" max="1">
        </label>
        </div>
      </section>

      <section class="card">
        <h3>提示词</h3>
        <textarea id="prompt" rows="6" placeholder="正向提示词 (danbooru tags, 逗号分隔)"></textarea>
        <div id="triggers" class="triggers"></div>
        <textarea id="negative" rows="3" placeholder="负向提示词"></textarea>
        <label class="checkline">
          <input type="checkbox" id="enhCompat">
          <span>Enhanced Compatibility</span>
        </label>
        <p class="hint">开启后使用经典参数组合（euler/normal, CFG 5, CLIP Skip 1）</p>
      </section>

      <section class="card">
        <h3 id="idToggle" style="cursor:pointer;user-select:none" title="点击收起/展开">一致性锁（IPAdapter） <span id="idArrow" style="font-size:11px;color:#888"></span></h3>
        <div id="idBody">
          <label class="checkline">
            <input type="checkbox" id="idOn">
            <span>锁定参考图的身份 / 风格</span>
          </label>
          <input type="file" id="idFile" accept="image/*">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <img id="idPreview" style="max-height:78px;display:none;border-radius:8px" alt="">
            <span id="idName" style="font-size:12px;color:#888"></span>
          </div>
          <button type="button" class="chip" id="idUseRef" style="display:none">用参考图当锁</button>
          <div class="grid2">
            <label>权重 <input id="idWeight" type="number" value="0.7" step="0.05" min="0" max="2"></label>
            <label>模式
              <select id="idType">
                <option value="linear">linear（均衡）</option>
                <option value="style transfer">style transfer（风格）</option>
                <option value="composition">composition（构图）</option>
                <option value="strong style transfer">strong style</option>
              </select>
            </label>
          </div>
          <label>预设
            <select id="idPreset">
              <option>PLUS (high strength)</option>
              <option>STANDARD (medium strength)</option>
              <option>PLUS FACE (portraits)</option>
            </select>
          </label>
          <p class="hint">拿一张参考图锁住长相/画风：换场景、换构图时脸和画风不变。</p>
        </div>
      </section>

      <section class="card">
        <h3>参数</h3>
        <div class="grid2">
          <label>Steps <input id="steps" type="number" value="28" min="1" max="150"></label>
          <label>CFG <input id="cfg" type="number" value="7" step="0.5" min="1" max="30"></label>
          <label>Sampler
            <select id="sampler">
              <option>euler</option><option>euler_ancestral</option>
              <option>dpmpp_2m</option><option>dpmpp_2m_sde</option>
              <option>dpmpp_3m_sde</option><option>dpmpp_sde</option>
              <option>ddim</option><option>unipc</option>
            </select>
          </label>
          <label>Scheduler
            <select id="scheduler">
              <option>normal</option><option>karras</option>
              <option>exponential</option><option>sgm_uniform</option>
            </select>
          </label>
          <label>宽 <input id="width" type="number" value="1024" step="64" min="512" max="2048"></label>
          <label>高 <input id="height" type="number" value="1536" step="64" min="512" max="2048"></label>
          <label class="seedline">Seed
            <input id="seed" type="number" value="-1">
            <button type="button" id="seedRandom" title="随机">🎲</button>
          </label>
          <label>张数 <input id="batch" type="number" value="1" min="1" max="8"></label>
        </div>
        <div class="presets">
          <button class="chip" data-w="1024" data-h="1024">1:1</button>
          <button class="chip" data-w="832" data-h="1216">2:3</button>
          <button class="chip" data-w="1024" data-h="1536">2:3 大</button>
          <button class="chip" data-w="1216" data-h="832">3:2</button>
        </div>
      </section>

      <button class="btn-primary" id="genBtn">生成</button>
      <div class="status" id="status"></div>

      <details id="instPanel" style="margin-top:14px">
        <summary style="font-size:12px;color:#9a9ab8;cursor:pointer;user-select:none">🔧 实例复位（换实例后粘贴新 ssh 信息，服务器自助恢复，无需本地网关）</summary>
        <textarea id="instInput" style="width:100%;box-sizing:border-box;margin-top:8px;background:#1b1b2f;color:#eee;border:1px solid #3a3a5c;border-radius:8px;padding:8px;font-size:12px;min-height:54px;font-family:ui-monospace,Consolas,monospace" placeholder="ssh -p 端口 root@host 密码 https://公网:8443"></textarea>
        <button type="button" id="instBtn" style="margin-top:8px;background:#3d4fa8;color:#fff;border:0;border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer">提交复位</button>
        <pre id="instOut" style="margin-top:8px;background:#14142a;border:1px solid #2c2c4a;border-radius:8px;padding:8px;font-size:11px;color:#b8b8d8;white-space:pre-wrap;word-break:break-all;min-height:18px;max-height:220px;overflow-y:auto"></pre>
      </details>
    </aside>

    <section class="results page-imgs">
      <div id="taskList" class="tasklist"></div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>
</div>

<!-- 大图查看 + 信息面板 -->
<div class="lightbox hidden" id="lightbox">
  <div class="lb-main">
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="">
    </div>
    <div class="lb-side" id="lbSide"></div>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-info" id="lbInfo"></div>
  <button class="lb-close" id="lbClose">✕</button>
</div>

<!-- 收藏面板 -->
<div class="favpanel hidden" id="favPanel">
  <div class="fav-head">
    <span>⭐ 收藏夹</span>
    <button class="lb-close" id="favClose" style="position:static">✕</button>
  </div>
  <div id="favList" class="fav-list"></div>
</div>

<script src="/static/app.js?v=20260916a"></script>
</body>
</html>
